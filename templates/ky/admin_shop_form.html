{% extends "ky/base.html" %}{% block content %}<main class="form-page"><div class="form-card"><h1>{% if shop %}Оңдоо{% else %}Жаңы дүкөн{% endif %}</h1><form class="stack" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Аталышы<input name="name" required value="{{shop.name if shop else ''}}"></label><label>Дареги<input name="address" required value="{{shop.address if shop else ''}}"></label><label>Телефон<input name="phone" required value="{{shop.phone if shop else ''}}"></label><label>Email<input type="email" name="email" required value="{{shop.email if shop else ''}}"></label><label>{% if shop %}Жаңы сырсөз (өзгөртпөсөңүз бош калтырыңыз){% else %}Сырсөз{% endif %}<input type="password" name="password" {% if not shop %}required{% endif %} minlength="8"></label><button class="btn full">Сактоо</button></form><p><a href="{{url_for('admin_dashboard')}}">Артка</a></p></div></main>{% endblock %}
