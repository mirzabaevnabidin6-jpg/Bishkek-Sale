{% extends 'ky/base.html' %}{% block title %}Акция | Bishkek Sale{% endblock %}{% block content %}<main class="form-page"><div class="form-card wide"><div class="eyebrow dark">ДҮКӨН КАБИНЕТИ</div><h1>{% if promo %}Акцияны оңдоо{% else %}Жаңы акция кошуу{% endif %}</h1><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Товардын аталышы<input required maxlength="120" name="title" value="{{promo.title if promo else ''}}" placeholder="Мисалы: Эркектер курткасы"></label><label>Категория<select name="category" required>{% for cat in categories %}<option value="{{category_label(cat)}}" {% if promo and promo.category==cat %}selected{% endif %}>{{category_label(cat)}}</option>{% endfor %}</select></label><div class="two"><label>Мурунку баасы (сом)<input type="number" step="0.01" min="0.01" name="original_price" required value="{{promo.original_price if promo else ''}}"></label><label>Арзандатылган баасы (сом)<input type="number" step="0.01" min="0" name="sale_price" required value="{{promo.sale_price if promo else ''}}"></label></div><label>Акциянын бүтүү күнү<input type="date" min="{{today}}" name="end_date" required value="{{promo.end_date if promo else ''}}"></label><label>Сүрөттүн URL дареги (милдеттүү эмес)<input type="url" name="image_url" value="{{promo.image_url if promo else ''}}" placeholder="https://example.com/image.jpg"></label><label>Сүрөттөмө<textarea name="description" rows="4" maxlength="1000" placeholder="Акциянын шарттары, өлчөмдөр...">{{promo.description if promo else ''}}</textarea></label><button class="btn full">Сактоо</button><a class="back" href="{{url_for('dashboard')}}">← Кабинетке кайтуу</a></form></div></main>{% endblock %}
