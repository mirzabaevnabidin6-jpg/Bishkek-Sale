{% extends 'ky/base.html' %}{% block title %}Дүкөн кошуу | Bishkek Sale{% endblock %}{% block content %}<main class="form-page"><div class="form-card"><div class="eyebrow dark">ӨНӨКТӨШ БОЛУҢУЗ</div><h1>Дүкөндү каттоо</h1><p class="muted">Дүкөнүңүз тууралуу маалыматты киргизиңиз.</p><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Дүкөндүн аталышы<input required maxlength="100" name="name" placeholder="Мисалы: Style Men"></label><label>Бишкектеги дареги<input required maxlength="200" name="address" placeholder="Көчө, имарат, соода борбору"></label><label>Телефон<input required maxlength="40" name="phone" placeholder="+996 ..."></label><label>Email<input required type="email" name="email" placeholder="shop@example.com"></label><label>Сырсөз (кеминде 8 белги)<input required minlength="8" type="password" name="password"></label><button class="btn full">Катталуу</button></form><p class="under">Аккаунтуңуз барбы? <a href="{{url_for('login')}}">Кирүү</a></p></div></main>{% endblock %}
