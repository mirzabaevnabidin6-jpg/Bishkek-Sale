{% extends "ru/base.html" %}{% block content %}<main class="form-page"><div class="form-card"><h1>{% if shop %}Изменить{% else %}Добавить магазин{% endif %}</h1><form class="stack" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Название<input name="name" required value="{{shop.name if shop else ''}}"></label><label>Адрес<input name="address" required value="{{shop.address if shop else ''}}"></label><label>Телефон<input name="phone" required value="{{shop.phone if shop else ''}}"></label><label>Email<input type="email" name="email" required value="{{shop.email if shop else ''}}"></label><label>{% if shop %}Новый пароль (оставьте пустым, чтобы не менять){% else %}Пароль{% endif %}<input type="password" name="password" {% if not shop %}required{% endif %} minlength="8"></label><button class="btn full">Сохранить</button></form><p><a href="{{url_for('admin_dashboard')}}">Назад</a></p></div></main>{% endblock %}
