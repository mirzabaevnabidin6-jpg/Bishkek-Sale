{% extends 'ru/base.html' %}{% block title %}Добавить магазин | Bishkek Sale{% endblock %}{% block content %}<main class="form-page"><div class="form-card"><div class="eyebrow dark">СТАНЬТЕ ПАРТНЕРОМ</div><h1>Регистрация магазина</h1><p class="muted">Введите данные вашего магазина.</p><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Название магазина<input required maxlength="100" name="name" placeholder="Например: Style Men"></label><label>Адрес в Бишкеке<input required maxlength="200" name="address" placeholder="Улица, дом, торговый центр"></label><label>Телефон<input required maxlength="40" name="phone" placeholder="+996 ..."></label><label>Email<input required type="email" name="email" placeholder="shop@example.com"></label><label>Пароль (не менее 8 символов)<input required minlength="8" type="password" name="password"></label><button class="btn full">Регистрация</button></form><p class="under">Уже есть аккаунт? <a href="{{url_for('login')}}">Войти</a></p></div></main>{% endblock %}
