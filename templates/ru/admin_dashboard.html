{% extends "ru/base.html" %}{% block content %}<main class="container dashboard"><div class="dash-head"><h1>Администратор — Магазины</h1><a class="btn" href="{{url_for('admin_new_shop')}}">+ Добавить магазин</a></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Название</th><th>Email</th><th>Телефон</th><th>Акции</th><th></th></tr></thead><tbody>{% for s in shops %}<tr><td><b>{{s.name}}</b><small>{{s.address}}</small></td><td>{{s.email}}</td><td>{{s.phone}}</td><td>{{s.promo_count}}</td><td class="actions"><a href="{{url_for('admin_edit_shop',sid=s.id)}}">Изменить</a><form method="post" action="{{url_for('admin_delete_shop',sid=s.id)}}" onsubmit="return confirm('Удалить магазин и все акции?')"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><button class="danger">Удалить</button></form></td></tr>{% endfor %}</tbody></table></div></div></main>{% endblock %}
