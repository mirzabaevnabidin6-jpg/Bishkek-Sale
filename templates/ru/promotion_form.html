{% extends 'ru/base.html' %}{% block title %}Акция | Bishkek Sale{% endblock %}{% block content %}<main class="form-page"><div class="form-card wide"><div class="eyebrow dark">КАБИНЕТ МАГАЗИНА</div><h1>{% if promo %}Редактировать акцию{% else %}Добавить акцию{% endif %}</h1><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label>Название товара<input required maxlength="120" name="title" value="{{promo.title if promo else ''}}" placeholder="Например: Мужская куртка"></label><label>Категория<select name="category" required>{% for cat in categories %}<option value="{{category_label(cat)}}" {% if promo and promo.category==cat %}selected{% endif %}>{{category_label(cat)}}</option>{% endfor %}</select></label><div class="two"><label>Старая цена (сом)<input type="number" step="0.01" min="0.01" name="original_price" required value="{{promo.original_price if promo else ''}}"></label><label>Цена по акции (сом)<input type="number" step="0.01" min="0" name="sale_price" required value="{{promo.sale_price if promo else ''}}"></label></div><label>Дата окончания акции<input type="date" min="{{today}}" name="end_date" required value="{{promo.end_date if promo else ''}}"></label><label>URL изображения (необязательно)<input type="url" name="image_url" value="{{promo.image_url if promo else ''}}" placeholder="https://example.com/image.jpg"></label><label>Описание<textarea name="description" rows="4" maxlength="1000" placeholder="Условия акции, размеры...">{{promo.description if promo else ''}}</textarea></label><button class="btn full">Сохранить</button><a class="back" href="{{url_for('dashboard')}}">← Вернуться в кабинет</a></form></div></main>{% endblock %}
